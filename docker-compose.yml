services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: glpidb
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes: [dbdata:/var/lib/mysql]
  glpi:
    image: diouxx/glpi
    ports: ["${GLPI_PORT:-8081}:80"]
    environment:
      TIMEZONE: America/Bogota
    depends_on: [db]
    volumes: [glpidata:/var/www/html/glpi]
  mail:
    image: axllent/mailpit
    ports: ["8025:8025"]
volumes:
  dbdata:
  glpidata:
